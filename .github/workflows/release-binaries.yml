name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: HikVision-Downloader-macOS.dmg
            artifact_pattern: dist/HikVision-Downloader-macOS.dmg
          - os: windows-latest
            artifact_name: HikVision-Downloader-Windows-x64.zip
            artifact_pattern: dist/HikVision-Downloader-Windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies and tools
        run: |
          uv sync --all-extras --dev
          uv pip install pyinstaller

      - name: Install macOS Packaging Utilities
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg || true

      - name: Build macOS Application & DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Build Windows Executable & ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/build_windows.ps1

      - name: Publish Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_pattern }}
          draft: false
          prerelease: false
          generate_release_notes: true
