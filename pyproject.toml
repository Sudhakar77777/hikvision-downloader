[project]
name = "hikvision-downloader"
version = "0.1.1"
description = "App to download video files from hikvision CCTV NVR"
readme = "README.md"
authors = [
    { name = "Sudhakar Balakrishnan", email = "sudhakar.ai77777@gmail.com" }
]
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.14.7"
dependencies = [
    "keyring>=24.0.0",
    "pydantic>=2.0",
    "pyside6>=6.6.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
hikvision-downloader = "hikvision_downloader.cli.app:main"
hikvision-downloader-gui = "hikvision_downloader.ui.main_window:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 150
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyinstaller>=6.11.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.10",
    "types-requests>=2.32.0",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests that require live NVR hardware (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.pyrefly]
python-version = "3.14"
preset = "strict"

[tool.pyrefly.errors]
implicit-any-lambda = "ignore"
missing-override-decorator = "ignore"
bad-argument-type = "ignore"
