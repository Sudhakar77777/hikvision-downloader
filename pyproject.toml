[project]
name = "hikvision-downloader"
version = "0.1.0"
description = "App to download video files from hikvision CCTV NVR"
readme = "README.md"
authors = [
    { name = "Sudhakar Balakrishnan", email = "sudhakar.ai77777@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
hikvision-downloader = "hikvision_downloader.downloader:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 150
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

